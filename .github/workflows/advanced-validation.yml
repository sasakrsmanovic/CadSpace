name: Advanced CAD validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  advanced:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Advanced geometry and exchange regression tests
        run: dotnet run --project tests/CadSpace.Advanced.Tests -c Release
      - name: Archive source for reproducible diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/CadSpace-advanced-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cadspace-advanced-source
          path: artifacts/CadSpace-advanced-source.zip
      - name: Prepare public SDK binaries for offline diagnostics
        if: github.event_name == 'pull_request'
        run: |
          ROOT=$(dirname "$(readlink -f "$(command -v dotnet)")")
          SDK=$(dotnet --version)
          RUNTIME=$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" && $2 ~ /^10\./ {print $2}' | sort -V | tail -1)
          tar -czf artifacts/dotnet-offline-linux-x64.tar.gz -C "$ROOT" dotnet "sdk/$SDK" "shared/Microsoft.NETCore.App/$RUNTIME" host/fxr packs/Microsoft.NETCore.App.Ref
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: cadspace-offline-sdk
          path: artifacts/dotnet-offline-linux-x64.tar.gz
          retention-days: 1
