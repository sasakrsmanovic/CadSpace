name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Geometry and document regression tests
        run: dotnet run --project tests/CadSpace.Tests -c Release
      - name: DXF and editing regression tests
        run: dotnet run --project tests/CadSpace.Exchange.Tests -c Release
      - name: Pack reusable libraries
        run: |
          for project in Geometry Model Dxf Engine; do
            dotnet pack src/CadSpace.$project -c Release -o artifacts/packages
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cadspace-core-packages
          path: artifacts/packages
