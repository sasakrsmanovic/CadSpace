name: Build, test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    concurrency:
      group: cadspace-core-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Geometry and document regression tests
        run: dotnet run --project tests/CadSpace.Tests -c Release
      - name: DXF and editing regression tests
        run: dotnet run --project tests/CadSpace.Exchange.Tests -c Release
      - name: Native persistence regression tests
        run: dotnet run --project tests/CadSpace.Persistence.Tests -c Release
      - name: Advanced geometry and exchange regression tests
        run: dotnet run --project tests/CadSpace.Advanced.Tests -c Release
      - name: Pack reusable libraries
        run: |
          for project in Geometry Model Dxf Engine Rendering; do
            dotnet pack src/CadSpace.$project -c Release -o artifacts/packages
          done
      - name: Source archive
        run: git archive --format=zip HEAD -o artifacts/CadSpace-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cadspace-libraries-and-source
          path: artifacts/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: cadspace-desktop-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop application
        run: dotnet build src/CadSpace.App -c Release -f net10.0-desktop -p:CadSpaceDesktopOnly=true
  browser:
    runs-on: ubuntu-latest
    concurrency:
      group: cadspace-browser-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish browser application
        run: dotnet publish src/CadSpace.App -c Release -f net10.0-browserwasm -p:WasmShellWebAppBasePath=/CadSpace/
      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          INDEX=$(find src/CadSpace.App/bin/Release/net10.0-browserwasm -path '*/publish/*' -name index.html -print -quit)
          test -n "$INDEX"
          mkdir -p artifacts/site
          cp -a "$(dirname "$INDEX")/." artifacts/site/
          touch artifacts/site/.nojekyll
          printf '{"commit":"%s","unoSdk":"6.7.30","configuration":"Release"}\n' "$GITHUB_SHA" > artifacts/site/build-info.json
      - name: Browser smoke test dependencies
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Test the published application
        run: |
          mkdir -p artifacts/server
          ln -s "$PWD/artifacts/site" artifacts/server/CadSpace
          python -m http.server 8177 --bind 127.0.0.1 --directory artifacts/server > artifacts/server.log 2>&1 &
          python tests/browser/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cadspace-browser-smoke
          path: |
            artifacts/browser-smoke
            artifacts/server.log
      - uses: actions/upload-artifact@v4
        with:
          name: cadspace-browser
          path: artifacts/site
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: artifacts/site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [core, browser]
    runs-on: ubuntu-latest
    concurrency:
      group: cadspace-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Only deploy the current main revision
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ "$HEAD" = "$GITHUB_SHA" ]; then echo 'current=true' >> "$GITHUB_OUTPUT"; else echo 'current=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/configure-pages@v5
        if: steps.head.outputs.current == 'true'
        with:
          enablement: true
      - name: Deploy browser application
        if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
